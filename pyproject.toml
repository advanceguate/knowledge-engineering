[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-engineering"
version = "0.1.0"
description = "Source-grounded ontology extraction and intentional-stance knowledge synthesis"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "docling>=2.30,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pydantic-ai>=1.61,<2",
  "langgraph>=0.3,<2",
  "rdflib>=7.1,<8",
  "pyshacl>=0.30,<1",
  "owlrl>=7.1,<8",
  "ebooklib>=0.18,<1",
  "beautifulsoup4>=4.12,<5",
  "markdownify>=0.14,<2",
  "rapidfuzz>=3.10,<4",
  "tiktoken>=0.8,<1",
  "diskcache>=5.6,<6",
  "tenacity>=9,<10",
  "orjson>=3.10,<4",
  "pyyaml>=6,<7",
  "jinja2>=3.1,<4",
  "typer>=0.15,<1",
  "rich>=13.9,<15"
]

[project.optional-dependencies]
retrieval = [
  "lancedb>=0.20,<1",
  "sentence-transformers>=3.4,<4"
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2"
]

[project.scripts]
ke = "ke.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ke"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "ke/_resources/config"
"prompts" = "ke/_resources/prompts"
"shapes" = "ke/_resources/shapes"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "ignore:Dataset\\.contexts is deprecated.*:DeprecationWarning",
  "ignore:Dataset\\.default_context is deprecated.*:DeprecationWarning",
  "ignore:ConjunctiveGraph is deprecated.*:DeprecationWarning"
]
